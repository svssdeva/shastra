[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/trishul-mcp"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["svssdeva"]
repository = "https://github.com/svssdeva/shastra"

[workspace.dependencies]
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
procfs = "0.17"
nix = { version = "0.30", features = ["feature", "fs", "user"] }
aya = "0.13"
aya-log = "0.2"
sysinfo = "0.39"
netstat2 = "0.11"
nusb = "0.2"
ferrisetw = "1.2"

[profile.release]
strip = "symbols"
lto = "thin"

# trishul-ebpf needs aggressive opts so BPF verifier accepts the program.
[profile.release.package.trishul-ebpf]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 1

[profile.dev.package.trishul-ebpf]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 1
