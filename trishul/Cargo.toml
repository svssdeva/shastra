[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["svssdeva"]
repository = "https://github.com/svssdeva/trishul"

[workspace.dependencies]
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
procfs = "0.17"
nix = { version = "0.30", features = ["feature", "fs", "user"] }

[profile.release]
strip = "symbols"
lto = "thin"
