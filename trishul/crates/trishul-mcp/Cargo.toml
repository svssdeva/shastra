[package]
name = "trishul-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "MCP server giving Claude live OS observability (processes, network, host info) across Linux/macOS/Windows, plus eBPF syscall tracing on Linux."

[[bin]]
name = "trishul-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
sysinfo = { workspace = true }
netstat2 = { workspace = true }
nusb = { workspace = true }

# Linux-only specialised paths: procfs reads, USB sysfs, eBPF.
[target.'cfg(target_os = "linux")'.dependencies]
procfs = { workspace = true }
nix = { workspace = true }
aya = { workspace = true }
aya-log = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
aya-build = "0.1"

[dev-dependencies]
serde_json = { workspace = true }
